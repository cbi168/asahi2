[PHP]
; Laravel 開發伺服器 PHP 配置

; 擴展目錄 - 使用絕對路徑
extension_dir = "c:\UniServer\core\php83\extensions"

; 必要的擴展 - 使用相對名稱
extension=openssl
extension=mbstring
extension=mysqli
extension=pdo_mysql
extension=gd
extension=fileinfo
extension=zip
extension=curl

; 基本設置
error_reporting = E_ALL
display_errors = On
display_startup_errors = On
log_errors = On
error_log = "C:\UniServer\vhosts\asahi2_test\storage\logs\php_errors.log"

; 時區設置
date.timezone = "Asia/Taipei"

; 記憶體限制
memory_limit = 256M

; 文件上傳
upload_max_filesize = 10M
post_max_size = 10M

; Session 設置
session.save_handler = files
session.save_path = "C:\UniServer\vhosts\asahi2_test\storage\framework\sessions"

